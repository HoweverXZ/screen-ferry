name: Feature request / 功能建议
description: An idea for something ScreenFerry should do / 希望 ScreenFerry 能做到的事
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        One idea per issue, please. Search existing issues first; if someone has asked already, a 👍 on theirs helps more.

        一个建议开一个 issue。先搜一下有没有人提过；提过的话，在那条下面点个 👍 更有用。
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do / 想解决什么问题
      description: The situation you're in and what gets in the way / 你在什么场景下用，卡在哪儿
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like / 希望怎么做
  - type: textarea
    id: workaround
    attributes:
      label: How you manage now / 现在怎么凑合
      description: Workarounds or other tools you've tried / 现在的变通办法，或者试过的其他工具
  - type: dropdown
    id: systems
    attributes:
      label: Systems / 涉及的系统
      multiple: true
      options:
        - macOS
        - Windows
