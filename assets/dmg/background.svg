<!-- Mac 安装盘（DMG）窗口的背景：660 × 400 pt，方案 B“品牌色带”。
     访达在上面画两个图标：ScreenFerry.app 的中心在 (165, 210)，“应用程序”替身在 (495, 210)，图标 128 pt。
     图标下面的文件名由访达来画、颜色由系统决定，所以那一块保持浅色。
     背景上的字不随系统语言变，中英文都写。最下面 28 pt 不放东西：打开了“显示路径栏”的访达会把那里盖住。
     由 cargo xtask icons 导出 background.png 和 background@2x.png。 -->
<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400">
  <defs>
    <clipPath id="band">
      <rect x="0" y="0" width="660" height="88"/>
    </clipPath>
  </defs>
  <rect x="0" y="0" width="660" height="400" fill="#F7F6FA"/>
  <rect x="0" y="0" width="660" height="88" fill="#5468F0"/>
  <g clip-path="url(#band)" fill="#FFFFFF">
    <circle cx="565" cy="15" r="65" fill-opacity="0.10"/>
    <circle cx="630" cy="73" r="65" fill-opacity="0.08"/>
    <circle cx="507" cy="79" r="45" fill-opacity="0.07"/>
  </g>
  <g font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, sans-serif">
    <text x="28" y="40" font-size="21" font-weight="800" fill="#FFFFFF">ScreenFerry</text>
    <text x="28" y="65" font-size="12.5" fill="#FFFFFF" fill-opacity="0.85">在多台电脑之间共享一套键盘鼠标</text>
    <text x="330" y="336" font-size="12.5" fill="#6F6B77" text-anchor="middle">拖进“应用程序”即可安装 · Drag into Applications to install</text>
  </g>
  <g fill="none" stroke="#5468F0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" transform="translate(270 190)">
    <path d="M 18 8 L 32 20 L 18 32" stroke-opacity="0.35"/>
    <path d="M 52 8 L 66 20 L 52 32" stroke-opacity="0.65"/>
    <path d="M 86 8 L 100 20 L 86 32"/>
  </g>
</svg>
