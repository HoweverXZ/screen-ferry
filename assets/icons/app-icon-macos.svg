<!-- 应用图标（macOS）：1024 画布，主体 824 见方居中，带系统图标的投影。
     “跃迁”：一颗光球正穿过屏幕边框，拖着一道光尾。
     由 cargo xtask icons 导出为设置界面 AppIcon 的 64–1024 像素（打包时 AppIcon.icns 也取自那里）；
     16、32 像素用 app-icon-macos-small.svg。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5B98FF"/>
      <stop offset="1" stop-color="#4A4AE2"/>
    </linearGradient>
    <radialGradient id="hl" cx="0.5" cy="0" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.7"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#CCD9FF"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <mask id="gap" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect width="100" height="100" fill="#FFFFFF"/>
      <circle cx="67" cy="50" r="17.5" fill="#000000"/>
    </mask>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.1"/>
      <feOffset dy="1.1" result="blur"/>
      <feFlood flood-color="#000000" flood-opacity="0.25"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g transform="translate(100 100) scale(8.24)">
    <rect width="100" height="100" rx="22.5" fill="url(#bg)" filter="url(#shadow)"/>
    <rect width="100" height="100" rx="22.5" fill="url(#hl)"/>
    <rect x="19" y="30" width="48" height="40" rx="10" fill="#FFFFFF" fill-opacity="0.16"
          stroke="#FFFFFF" stroke-opacity="0.92" stroke-width="3.2" mask="url(#gap)"/>
    <rect x="36" y="45.5" width="31" height="9" rx="4.5" fill="url(#tail)"/>
    <circle cx="67" cy="50" r="20" fill="url(#glow)"/>
    <circle cx="67" cy="50" r="12.5" fill="url(#orb)"/>
  </g>
</svg>
