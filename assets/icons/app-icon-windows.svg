<!-- 应用图标（Windows）：256 画布，主体几乎铺满，圆角比 macOS 小。
     由 cargo xtask icons 导出为设置界面 app_icon.ico 的 48–256 像素；16–32 像素用 app-icon-windows-small.svg。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5B98FF"/>
      <stop offset="1" stop-color="#4A4AE2"/>
    </linearGradient>
    <radialGradient id="hl" cx="0.5" cy="0" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.7"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#CCD9FF"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <mask id="gap" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect width="100" height="100" fill="#FFFFFF"/>
      <circle cx="67" cy="50" r="17.5" fill="#000000"/>
    </mask>
  </defs>
  <g transform="translate(4 4) scale(2.48)">
    <rect width="100" height="100" rx="20" fill="url(#bg)"/>
    <rect width="100" height="100" rx="20" fill="url(#hl)"/>
    <rect x="19" y="30" width="48" height="40" rx="10" fill="#FFFFFF" fill-opacity="0.16"
          stroke="#FFFFFF" stroke-opacity="0.92" stroke-width="3.2" mask="url(#gap)"/>
    <rect x="36" y="45.5" width="31" height="9" rx="4.5" fill="url(#tail)"/>
    <circle cx="67" cy="50" r="20" fill="url(#glow)"/>
    <circle cx="67" cy="50" r="12.5" fill="url(#orb)"/>
  </g>
</svg>
