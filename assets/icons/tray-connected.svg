<!-- 托盘图标（macOS 菜单栏模板图，已连接）：一块屏幕，右下角一个实心光标，光标周围留一圈空隙。
     只看透明度，系统按明暗模式着色。由 cargo xtask icons 导出为 tray-connected@2x.png（36×36）。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <defs>
    <mask id="gap" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24">
      <rect width="24" height="24" fill="#FFFFFF"/>
      <path d="M 0 0 L 0 20 L 4.9 15.6 L 8.1 23 L 11.4 21.6 L 8.3 14.4 L 14.8 14.4 Z" transform="translate(15.4 10.2) scale(0.43)" fill="#000000" stroke="#000000" stroke-width="8.5" stroke-linejoin="round"/>
    </mask>
  </defs>
  <g mask="url(#gap)" fill="none" stroke="#000000" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2.6" y="4.2" width="16.4" height="11.4" rx="2.6"/>
    <path d="M 10.8 15.6 L 10.8 18.8 M 7.4 19.2 L 14.2 19.2"/>
  </g>
  <path d="M 0 0 L 0 20 L 4.9 15.6 L 8.1 23 L 11.4 21.6 L 8.3 14.4 L 14.8 14.4 Z" transform="translate(15.4 10.2) scale(0.43)" fill="#000000" stroke="#000000" stroke-width="2.4" stroke-linejoin="round"/>
</svg>
