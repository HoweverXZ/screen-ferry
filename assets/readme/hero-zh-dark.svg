<!-- README 头图（中文、深色）：左边图标、标题和副标题，右边一台笔记本、一台显示器，光标沿一道拖尾从这台划到那台。
     由 cargo xtask icons 导出为同名 PNG（2560×1280），README 里按 GitHub 的浅色、深色主题切换。 -->
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" xml:lang="zh-CN" font-family="'Helvetica Neue', 'Hiragino Sans GB', 'PingFang SC', sans-serif" role="img" aria-label="ScreenFerry：鼠标推过去，就到了另一台">
<defs><linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#232A5C"/><stop offset="1" stop-color="#121530"/></linearGradient><linearGradient id="wall-a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9DB0FF"/><stop offset="1" stop-color="#5566E2"/></linearGradient><linearGradient id="wall-b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFD9C0"/><stop offset="1" stop-color="#F29D76"/></linearGradient><linearGradient id="silver" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9AA0B2"/><stop offset="1" stop-color="#5E6375"/></linearGradient><linearGradient id="photo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFB37A"/><stop offset="1" stop-color="#7C8CFF"/></linearGradient><clipPath id="panel-shape"><rect width="520" height="404" rx="28"/></clipPath><filter id="card" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000000" flood-opacity="0.45"/></filter><filter id="device" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/></filter><filter id="cursor" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="1" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.3"/></filter></defs>
<rect width="1280" height="640" fill="#0E1016"/>
<svg x="64" y="52" width="84" height="84" viewBox="0 0 1024 1024"><defs>
    <linearGradient id="icon-porcelain" x1="0" y1="0" x2="0.35" y2="1">
