    </clipPath>
    <filter id="icon-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.1"/>
      <feOffset dy="1.1" result="blur"/>
      <feFlood flood-color="#000000" flood-opacity="0.25"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="icon-groove" filterUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <feFlood flood-color="#70748F" flood-opacity="0.6" result="ink"/>
      <feComposite in="ink" in2="SourceAlpha" operator="out" result="outside"/>
      <feGaussianBlur in="outside" stdDeviation="0.5" result="outside-blur"/>
      <feOffset in="outside-blur" dx="0.55" dy="0.75" result="outside-shift"/>
      <feComposite in="outside-shift" in2="SourceAlpha" operator="in" result="inner"/>
      <feFlood flood-color="#FFFFFF" result="light"/>
      <feComposite in="light" in2="SourceAlpha" operator="in" result="light-shape"/>
      <feOffset in="light-shape" dx="0.4" dy="0.55" result="light-shift"/>
      <feComposite in="light-shift" in2="SourceAlpha" operator="out" result="lip"/>
      <feMerge>
        <feMergeNode in="lip"/>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="inner"/>
      </feMerge>
    </filter>
    <filter id="icon-lift" filterUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <feDropShadow dx="-0.9" dy="0.9" stdDeviation="1.2" flood-color="#1D1F6B" flood-opacity="0.38"/>
