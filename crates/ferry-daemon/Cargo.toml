[package]
name = "ferry-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "screenferry"
path = "src/main.rs"
test = false

[dependencies]
ferry-core.workspace = true
ferry-engine.workspace = true
ferry-platform.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
ferry-platform-windows.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
ferry-platform-macos.workspace = true

[lints]
workspace = true
